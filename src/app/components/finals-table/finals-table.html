<div class="container-fluid px-0">
  <h4>Posición Final</h4>

  <div class="row g-4">

    <!-- COLUMNA IZQUIERDA -->
    <div class="col-12 col-md-6 text-center">

      <!-- Imagen -->
      <img
        src="/images/cup.jpg"
        alt="Copa del Mundo"
        class="img-fluid mb-3 table-image"
      />

      <!-- Tabla -->
      <table class="table table-striped table-bordered table-hover w-100">
        <thead class="thead-dark">
          <tr>
            <th>Posición</th>
            <th>Equipo</th>
          </tr>
        </thead>
        <tbody>
          <ng-container *ngFor="let i of [1, 2, 3, 4]; let last = last">
            <tr>
              <td class="text-center">{{ i }}</td>
              <td>
                <ng-select
                  [(ngModel)]="selectedTeamIds[i-1]"
                  [items]="teams"
                  bindLabel="name"
                  bindValue="id"
                  placeholder="Seleccionar equipo"
                  (ngModelChange)="onTeamChange($event, i)"
                  [searchable]="true"
                  class="w-100">
                </ng-select>
              </td>
            </tr>

            <tr *ngIf="!last">
              <td colspan="2" style="height: 20px;"></td>
            </tr>
          </ng-container>
        </tbody>
      </table>
    </div>

    <!-- COLUMNA DERECHA -->
    <div class="col-12 col-md-6 text-center">

      <!-- Imagen -->
      <img
        src="/images/goal.jpg"
        alt="Balón"
        class="img-fluid mb-3 table-image"
      />

      <!-- Tabla -->
      <table class="table table-striped table-bordered table-hover w-100">
        <thead class="thead-dark">
          <tr>
            <th>Equipo con Goleador</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>
              <ng-select
                [(ngModel)]="favoriteTeamId"
                [items]="teams"
                bindLabel="name"
                bindValue="id"
                placeholder="Seleccionar equipo"
                (ngModelChange)="onScorerChange($event)"
                [searchable]="true"
                class="w-100">
              </ng-select>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

  </div>
</div>
