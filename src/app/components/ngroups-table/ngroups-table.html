<div class="table-wrapper">
  <table class="groups-table">
    <colgroup>
      <col style="width: 200px; min-width: 200px;">
      <col style="width: 100px; min-width: 100px;">
    </colgroup>
    <thead>
      <tr class="section-header">
        <th colspan="2">PREDICCIONES FASE DE GRUPOS</th>
        <th *ngFor="let player of visiblePlayers" class="player-header">
          {{ player.name }}
          <div class="player-score">{{ getGroupScore(player.id) }}</div>
        </th>
      </tr>
    </thead>

    <tbody>
      <ng-container *ngFor="let groupRow of groupRows">
        <!-- Encabezado del grupo -->
        <tr class="group-header-row">
          <th>GRUPO {{ groupRow.group }}</th>
          <th>Posición Real</th>
          <th *ngFor="let player of visiblePlayers">Posición</th>
        </tr>

        <!-- Equipos del grupo -->
        <tr *ngFor="let teamRow of groupRow.teams">
          <td class="team-name">{{ teamRow.team.name }}</td>

          <td class="real-position">
            <input type="number" min="1" max="4" [(ngModel)]="teamRow.realPosition"
              (ngModelChange)="onPositionChange(teamRow,groupRow)" class="position-input" placeholder="-"
              [disabled]="teamRow.locked" [class.locked-position]="teamRow.locked" />
          </td>

          <td *ngFor="let pp of visiblePredictions(teamRow.playerPredictions)" [class.winner-match]="pp.correct" class="prediction-cell">
            {{ pp.predictedPosition > 0 ? pp.predictedPosition : '-' }}
          </td>
        </tr>

        <!-- Total puntos del grupo -->
        <tr class="group-total-row">
          <td colspan="2" class="group-total-label">Puntos grupo {{ groupRow.group }}</td>
          <td *ngFor="let player of visiblePlayers" class="group-total-cell"
            [class.exact-match]="hasFullGroupMatch(player.id, groupRow)">
            {{ getGroupPointsForPlayer(player.id, groupRow) }}
          </td>
        </tr>

        <!-- Espaciador entre grupos -->
        <tr class="group-spacer">
          <td [attr.colspan]="2 + visiblePlayers.length"></td>
        </tr>
      </ng-container>
    </tbody>
  </table>
</div>
