<div class="table-responsive">
  <h4>Participantes</h4>

  <!-- Tabla -->

  <div class="table-container">
    <table class="table table-striped table-bordered table-hover">
      <thead class="thead-dark">
        <tr>
          <th>POSICIÓN</th>
          <th>PARTICIPANTE</th>
          <th>PUNTOS</th>

        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let player of paginatedPlayers(); index as i">
          <td class="font-weight-bold">
            {{ i + 1}}
          </td>
          <td class="font-weight-bold">
            {{ player.name }}
          </td>
          <td class="text-center">
            {{player.total_score + player.total_current_phase}}
            <span *ngIf="player.trend === 'up'" class="text-success">▲</span>
            <span *ngIf="player.trend === 'down'" class="text-danger">▼</span>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
  <!-- Paginación -->
  <div class="d-flex justify-content-between align-items-center">
    <div>
      Mostrando {{ paginatedPlayers().length }} de {{ players().length }} jugadores
    </div>
    <nav>
      <ul class="pagination">
        <li class="page-item" [class.disabled]="currentPage() === 1">
          <a class="page-link" (click)="previousPage()" style="cursor: pointer;">Anterior</a>
        </li>

        <li class="page-item" *ngFor="let page of pages()" [class.active]="currentPage() === page">
          <a class="page-link" (click)="goToPage(page)" style="cursor: pointer;">{{ page }}</a>
        </li>

        <li class="page-item" [class.disabled]="currentPage() === totalPages()">
          <a class="page-link" (click)="nextPage()" style="cursor: pointer;">Siguiente</a>
        </li>
      </ul>
    </nav>
  </div>
</div>
