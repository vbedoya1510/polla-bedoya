<div class="login-container">
    <form class="login-card" (submit)="handleLogin($event)">
        <div class="login-header">
            <h2>Polla Mundialista</h2>
            <p>Ingresa tus credenciales para continuar</p>
        </div>

        <div class="form-group">
            <label for="email">Correo Electrónico</label>
            <input type="email" id="email" placeholder="ejemplo@correo.com" (input)="email.set(emailInput.value)"
                #emailInput required />
        </div>

        <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" placeholder="••••••••" (input)="password.set(passInput.value)"
                #passInput required />
        </div>

        @if (errorMessage()) {
        <div class="error-message">
            {{ errorMessage() }}
        </div>
        }

        <button type="submit" [disabled]="isLoading()" class="btn-login">
            @if (isLoading()) {
            <span class="spinner"></span>
            } @else {
            Iniciar Sesión
            }
        </button>
    </form>
</div>
